<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>考试小时钟 · 行测</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #eef3f8; overflow: hidden; transition: background 0.35s ease; }

  :root {
    --bg: #eef3f8;
    --bg-shadow-light: #ffffff;
    --bg-shadow-dark: #c8d0d8;
    --text-primary: #2c3e50;
    --text-secondary: #6b8098;
    --text-muted: #8a9bb0;
    --accent: #3a4a5a;
    --icon-color: #2c3e50;
    --surface: #eef3f8;
    --input-bg: #eef3f8;
    --input-text: #2c3e50;
    --input-shadow-in: inset 3px 3px 6px #c8d0d8, inset -3px -3px 6px #ffffff;
    --btn-shadow: 6px 6px 12px #c8d0d8, -6px -6px 12px #ffffff;
    --btn-shadow-active: inset 4px 4px 8px #c8d0d8, inset -4px -4px 8px #ffffff;
    --clock-border: #b8c8d8;
    --clock-tick-major: #8a9bb0;
    --clock-tick-minor: #c0ccd8;
    --clock-num: #7a8ea0;
    --clock-center: #b8cce0;
    --handle-bar: #c0ccd8;
    --handle-bar-hover: #8a9bb0;
    --border-subtle: rgba(180,190,200,0.25);
    --scroll-thumb: #c8d0d8;
    --panel-shadow: 0 -4px 20px rgba(180,190,200,0.15);
    --duration-bg: #eef3f8;
    --time-icon-filter: none;
  }

  body.dark {
    --bg: #1a1f2a;
    --bg-shadow-light: #232a38;
    --bg-shadow-dark: #10141c;
    --text-primary: #e8edf5;
    --text-secondary: #a0b0c4;
    --text-muted: #6b8098;
    --accent: #c8d8e8;
    --icon-color: #d0dae8;
    --surface: #1a1f2a;
    --input-bg: #1a1f2a;
    --input-text: #e8edf5;
    --input-shadow-in: inset 3px 3px 6px #10141c, inset -3px -3px 6px #232a38;
    --btn-shadow: 6px 6px 12px #10141c, -6px -6px 12px #232a38;
    --btn-shadow-active: inset 4px 4px 8px #10141c, inset -4px -4px 8px #232a38;
    --clock-border: #3a4a5a;
    --clock-tick-major: #6a7a8a;
    --clock-tick-minor: #3a4a5a;
    --clock-num: #8a9bb0;
    --clock-center: #4a5a6a;
    --handle-bar: #4a5a6a;
    --handle-bar-hover: #6a8098;
    --border-subtle: rgba(60,80,100,0.4);
    --scroll-thumb: #3a4a5a;
    --panel-shadow: 0 -4px 20px rgba(0,0,0,0.4);
    --duration-bg: #1a1f2a;
    --time-icon-filter: invert(0.85) brightness(1.2);
  }

  body { background: var(--bg); }

  .app { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: stretch; overflow: hidden; }

  .clock-pane {
    flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; overflow: hidden; position: relative; min-height: 0;
    transition: flex-grow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .clock-container {
    position: relative; border-radius: 50%; background: var(--surface);
    box-shadow: inset 8px 8px 18px var(--bg-shadow-dark), inset -8px -8px 18px var(--bg-shadow-light);
    display: flex; align-items: center; justify-content: center;
    transition: width 0.3s ease, height 0.3s ease, box-shadow 0.35s ease; flex-shrink: 0;
  }
  canvas { display: block; width: 100%; height: 100%; border-radius: 50%; background: transparent; cursor: default; touch-action: none; }

  .exam-controls { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; flex-shrink: 0; }
  .exam-controls button {
    background: var(--surface); border: none; border-radius: 40px; color: var(--accent);
    font-weight: 600; font-size: 15px; padding: 10px 22px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; transition: all 0.15s, background 0.35s ease; box-shadow: var(--btn-shadow); white-space: nowrap;
  }
  .exam-controls button:active { box-shadow: var(--btn-shadow-active); transform: scale(0.97); }
  .exam-controls button .icon { color: var(--icon-color); font-size: 16px; line-height: 1; transition: color 0.35s ease; }
  .exam-controls button.active { box-shadow: var(--btn-shadow-active); color: var(--text-primary); }

  .split-handle { flex-shrink: 0; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; position: relative; background: transparent; }
  .split-handle .bar { width: 44px; height: 5px; border-radius: 3px; background: var(--handle-bar); transition: background 0.2s; }
  .split-handle:hover .bar { background: var(--handle-bar-hover); }
  .split-handle:active .bar { background: var(--handle-bar-hover); }

  .input-pane {
    flex: 0 0 0; display: flex; flex-direction: column; overflow: hidden; background: var(--surface);
    border-top: 1px solid var(--border-subtle); border-radius: 24px 24px 0 0; box-shadow: var(--panel-shadow);
    transition: flex-grow 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.35s ease, box-shadow 0.35s ease; min-height: 0;
  }
  .input-pane.expanded { flex: 1 1 0; }
  .input-scroll { flex: 1; overflow-y: auto; padding: 18px 32px 32px; display: flex; flex-direction: column; gap: 22px; -webkit-overflow-scrolling: touch; }

  .section { display: flex; flex-direction: column; gap: 10px; }
  .section-title { font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); transition: color 0.35s ease; }

  .time-row { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; }
  .time-row label { font-size: 14px; color: var(--text-secondary); font-weight: 500; transition: color 0.35s ease; }
  .time-row input[type="time"] {
    background: var(--input-bg); border: none; color: var(--input-text); font-size: 16px; font-weight: 600;
    padding: 8px 14px; border-radius: 30px; outline: none; width: 120px; text-align: center;
    box-shadow: var(--input-shadow-in); transition: background 0.35s ease, color 0.35s ease, box-shadow 0.35s ease;
  }
  .time-row input[type="time"]::-webkit-calendar-picker-indicator { filter: var(--time-icon-filter); cursor: pointer; transition: filter 0.35s ease; }
  .time-row input[type="time"] { color-scheme: light; }
  body.dark .time-row input[type="time"] { color-scheme: dark; }

  .sub-form-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
  .sub-form-row label { color: var(--text-secondary); font-size: 13px; font-weight: 500; transition: color 0.35s ease; }
  .sub-form-row input[type="text"] {
    background: var(--input-bg); border: none; color: var(--input-text); font-size: 14px;
    padding: 8px 12px; border-radius: 24px; outline: none; width: 90px;
    box-shadow: var(--input-shadow-in); transition: background 0.35s ease, color 0.35s ease, box-shadow 0.35s ease;
  }

  .duration-wrap {
    display: inline-flex; align-items: center; background: var(--duration-bg); border-radius: 24px;
    box-shadow: var(--input-shadow-in); padding: 0 10px 0 0;
    transition: background 0.35s ease, box-shadow 0.35s ease;
  }
  .duration-wrap input[type="number"] {
    width: 52px; background: transparent; border: none; color: var(--input-text); font-size: 14px; font-weight: 500;
    padding: 8px 4px 8px 12px; text-align: center; outline: none; -moz-appearance: textfield; appearance: textfield;
    box-shadow: none; transition: color 0.35s ease;
  }
  .duration-wrap input[type="number"]::-webkit-outer-spin-button,
  .duration-wrap input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .duration-wrap .unit { font-size: 12px; color: var(--text-muted); font-weight: 500; padding-left: 2px; flex-shrink: 0; transition: color 0.35s ease; }

  .sub-form-row input[type="color"] {
    -webkit-appearance: none; -moz-appearance: none; appearance: none; width: 34px; height: 34px;
    border: none; border-radius: 50%; background: var(--input-bg); cursor: pointer; padding: 0; overflow: hidden;
    box-shadow: var(--input-shadow-in); flex-shrink: 0; transition: background 0.35s ease, box-shadow 0.35s ease;
  }
  .sub-form-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; overflow: hidden; }
  .sub-form-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
  .sub-form-row input[type="color"]::-moz-color-swatch { border: none; border-radius: 50%; }
  .sub-form-row input[type="color"]::-moz-color-swatch-wrapper { padding: 0; border-radius: 50%; overflow: hidden; }

  .add-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; font-weight: 400; cursor: pointer; padding: 0 8px; line-height: 1; box-shadow: none; transform: none; transition: color 0.35s ease; }
  .add-btn:active { transform: scale(0.9); box-shadow: none; }
  .add-btn:hover { color: var(--text-secondary); }

  .cancel-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 0 8px; line-height: 1; box-shadow: none; transform: none; display: none; transition: color 0.35s ease; }
  .cancel-btn:active { transform: scale(0.9); box-shadow: none; }

  .sub-list { display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  .sub-item {
    display: flex; align-items: center; gap: 12px; background: var(--surface); padding: 10px 16px; border-radius: 30px;
    box-shadow: var(--input-shadow-in); font-size: 13px; color: var(--text-secondary); border-left: 5px solid #ccc;
    cursor: pointer; transition: all 0.15s, background 0.35s ease, box-shadow 0.35s ease;
  }
  .sub-item.selected { box-shadow: var(--input-shadow-in), 0 0 0 2px rgba(120,170,220,0.3); }
  .sub-item .name { font-weight: 600; color: var(--text-primary); min-width: 60px; transition: color 0.35s ease; }
  .sub-item .duration { font-weight: 500; color: var(--text-secondary); transition: color 0.35s ease; }
  .sub-item .time-range { font-size: 11px; color: var(--text-muted); margin-left: auto; transition: color 0.35s ease; }
  .sub-item .remove { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 0 4px; box-shadow: none; transform: none; transition: color 0.35s ease; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; transition: background 0.35s ease; }

  @media (max-width: 860px) and (orientation: portrait) {
    .exam-controls { gap: 10px; }
    .exam-controls button { padding: 9px 16px; font-size: 14px; }
    .input-scroll { padding: 14px 20px 28px; gap: 18px; }
    .section-title { font-size: 11px; }
    .time-row { gap: 10px 12px; }
    .time-row input[type="time"] { width: 108px; font-size: 15px; padding: 7px 10px; }
    .sub-form-row { gap: 8px 10px; }
    .sub-form-row input[type="text"] { width: 78px; }
    .duration-wrap input[type="number"] { width: 44px; font-size: 13px; padding: 7px 4px 7px 10px; }
    .duration-wrap .unit { font-size: 11px; }
    .sub-form-row input[type="color"] { width: 32px; height: 32px; }
    .sub-item { padding: 9px 12px; gap: 8px; }
    .sub-item .name { min-width: 48px; }
    .sub-item .time-range { font-size: 10px; }
  }

  @media (max-width: 420px) and (orientation: portrait) {
    .exam-controls button { padding: 8px 12px; font-size: 13px; }
    .time-row label { font-size: 13px; }
    .sub-form-row label { font-size: 12px; }
    .sub-form-row input[type="text"] { width: 70px; }
    .input-scroll { padding: 12px 16px 24px; gap: 16px; }
  }

  @media (orientation: landscape) and (max-height: 600px) {
    .app { flex-direction: row; align-items: stretch; }
    .clock-pane { flex: 1 1 0; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    .split-handle { width: 28px; height: auto; cursor: pointer; flex-direction: column; }
    .split-handle .bar { width: 5px; height: 44px; border-radius: 3px; }
    .input-pane { border-top: none; border-left: 1px solid var(--border-subtle); border-radius: 24px 0 0 24px; box-shadow: -4px 0 20px rgba(0,0,0,0.15); }
    .input-pane.expanded { flex: 1 1 0; }
    .input-scroll { padding: 16px 20px 20px; gap: 14px; }
    .section-title { font-size: 10px; }
    .time-row { gap: 8px 10px; }
    .time-row input[type="time"] { width: 96px; font-size: 14px; padding: 6px 8px; }
    .sub-form-row { gap: 6px 8px; }
    .sub-form-row input[type="text"] { width: 64px; padding: 6px 8px; font-size: 13px; }
    .duration-wrap input[type="number"] { width: 40px; font-size: 12px; padding: 6px 4px 6px 8px; }
    .duration-wrap .unit { font-size: 10px; }
    .sub-form-row input[type="color"] { width: 30px; height: 30px; }
    .sub-item { padding: 7px 10px; gap: 6px; font-size: 12px; }
    .sub-item .name { min-width: 40px; }
    .sub-item .time-range { font-size: 9px; }
    .exam-controls button { padding: 8px 14px; font-size: 13px; }
  }

  @media (orientation: landscape) and (max-height: 420px) {
    .section-title { display: none; }
    .input-scroll { gap: 10px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="clock-pane" id="clockPane">
    <div class="clock-container" id="clockContainer">
      <canvas id="clockCanvas" width="500" height="500"></canvas>
    </div>
    <div class="exam-controls">
      <button id="startBtn"><span class="icon">▶</span> 开始</button>
      <button id="pauseBtn"><span class="icon">⏸</span> 暂停</button>
      <button id="stopBtn"><span class="icon">⏹</span> 结束</button>
      <button id="labelToggleBtn" title="显示扇形文字">字</button>
      <button id="themeToggleBtn" title="切换暗夜模式"><span class="icon">☾</span></button>
    </div>
  </div>

  <div class="split-handle" id="splitHandle">
    <div class="bar"></div>
  </div>

  <div class="input-pane" id="inputPane">
    <div class="input-scroll">
      <div class="section">
        <div class="section-title">考试区间</div>
        <div class="time-row">
          <label>开始</label><input type="time" id="startTimeInput" value="14:00">
          <label>结束</label><input type="time" id="endTimeInput" value="15:30">
        </div>
      </div>

      <div class="section">
        <div class="section-title" id="subFormTitle">子时间段</div>
        <div class="sub-form-row" id="subFormRow">
          <label>名称</label><input type="text" id="subName" value="资料">
          <label>时长</label>
          <span class="duration-wrap">
            <input type="number" id="subDuration" value="25" min="1" max="720">
            <span class="unit">min</span>
          </span>
          <label>颜色</label><input type="color" id="subColor" value="#a8d8ea">
          <button id="addSubBtn" class="add-btn" title="添加">+</button>
          <button id="cancelEditBtn" class="cancel-btn" title="取消">✕</button>
        </div>
        <div class="sub-list" id="subListContainer"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('clockCanvas');
  const ctx = canvas.getContext('2d');
  const size = 500, cx = size/2, cy = size/2, R = size*0.46;
  const CIRCLE_MINUTES = 60;
  const SEGMENT_RADIUS = R - 52;

  let examStart = 14*60;
  let examEnd = 15*60 + 30;
  let subSegments = [
    { name:'资料', duration:25, color:'#a8d8ea' },
    { name:'逻辑', duration:25, color:'#f4b8c8' },
    { name:'言语', duration:10, color:'#b8e6c8' },
    { name:'数学', duration:18, color:'#f8d8a8' },
    { name:'政治+常识', duration:7, color:'#d8b8f0' }
  ];

  let isRunning = false, isPaused = false, clockInterval = null;
  let virtualMinutes = null;
  let accumulatedMs = 0;
  let lastTickTime = null;
  let isEnded = false;
  let activeSubIndex = -1;
  let editingIndex = -1;
  let showLabels = false;
  let isDark = false;

  const clockPane = document.getElementById('clockPane');
  const inputPane = document.getElementById('inputPane');
  const clockContainer = document.getElementById('clockContainer');
  const splitHandle = document.getElementById('splitHandle');
  const labelToggleBtn = document.getElementById('labelToggleBtn');
  const themeToggleBtn = document.getElementById('themeToggleBtn');

  const startInput = document.getElementById('startTimeInput');
  const endInput = document.getElementById('endTimeInput');
  const subNameInput = document.getElementById('subName');
  const subDurationInput = document.getElementById('subDuration');
  const subColorInput = document.getElementById('subColor');
  const addSubBtn = document.getElementById('addSubBtn');
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  const subFormTitle = document.getElementById('subFormTitle');
  const subListDiv = document.getElementById('subListContainer');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn = document.getElementById('stopBtn');

  function setTheme(dark){
    isDark = dark;
    document.body.classList.toggle('dark', dark);
    themeToggleBtn.innerHTML = dark ? '<span class="icon">☀</span>' : '<span class="icon">☾</span>';
    themeToggleBtn.title = dark ? '切换亮色模式' : '切换暗夜模式';
    drawClock();
  }
  themeToggleBtn.onclick = () => setTheme(!isDark);
  try { if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme(true); } catch(e){}

  function pad(n){ return n.toString().padStart(2,'0'); }
  function to24Str(m){ m = ((m%1440)+1440)%1440; return pad(Math.floor(m/60))+':'+pad(m%60); }
  function from24Str(s){ const[h,m]=s.split(':').map(Number); return h*60+m; }
  function updateInputs(){ startInput.value = to24Str(examStart); endInput.value = to24Str(examEnd); }

  function lightenColor(hex, amount = 0.35) {
    let r = parseInt(hex.slice(1,3), 16);
    let g = parseInt(hex.slice(3,5), 16);
    let b = parseInt(hex.slice(5,7), 16);
    r = Math.round(r + (255 - r) * amount);
    g = Math.round(g + (255 - g) * amount);
    b = Math.round(b + (255 - b) * amount);
    return `rgb(${r},${g},${b})`;
  }

  let inputExpanded = false;
  function toggleInputPane(){
    inputExpanded = !inputExpanded;
    if (inputExpanded) inputPane.classList.add('expanded');
    else inputPane.classList.remove('expanded');
    setTimeout(() => { updateClockSize(); drawClock(); }, 420);
  }
  splitHandle.onclick = toggleInputPane;

  labelToggleBtn.onclick = () => {
    showLabels = !showLabels;
    labelToggleBtn.classList.toggle('active', showLabels);
    drawClock();
  };

  function updateClockSize(){
    const cw = clockPane.clientWidth;
    const ch = clockPane.clientHeight;
    const controlsH = 62;
    const padding = 16;
    const avail = Math.min(cw - padding * 2, ch - controlsH - padding * 2);
    const dia = Math.max(80, Math.min(avail, 560));
    clockContainer.style.width = dia + 'px';
    clockContainer.style.height = dia + 'px';
  }

  let resizeTimer = null;
  function onResize(){
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { updateClockSize(); drawClock(); }, 100);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => { setTimeout(onResize, 300); });

  function clampSubSegments() {
    const totalExam = Math.max(0, examEnd - examStart);
    if (totalExam <= 0) { subSegments = []; return; }
    subSegments.forEach(s => { if (s.duration < 1) s.duration = 1; });
    let sum = subSegments.reduce((a, s) => a + s.duration, 0);
    if (sum <= totalExam) return;
    let excess = sum - totalExam;
    for (let i = subSegments.length - 1; i >= 0 && excess > 0; i--) {
      const s = subSegments[i];
      if (s.duration <= 1) continue;
      const reducible = Math.min(s.duration - 1, excess);
      s.duration -= reducible;
      excess -= reducible;
    }
    while (subSegments.reduce((a, s) => a + s.duration, 0) > totalExam && subSegments.length > 0) subSegments.pop();
    if (subSegments.reduce((a, s) => a + s.duration, 0) > totalExam) subSegments = [];
    if (editingIndex >= subSegments.length) exitEditMode();
    if (activeSubIndex >= subSegments.length) activeSubIndex = -1;
  }

  function getElapsedMinutes(){
    if (virtualMinutes !== null) return Math.max(0, virtualMinutes - examStart);
    if (isEnded) return examEnd - examStart;
    return 0;
  }

  function getCSSVar(name){
    return getComputedStyle(document.body).getPropertyValue(name).trim();
  }

  // 绘制一段扇形：从 offsetStart 到 offsetEnd（考试偏移分钟）
  // 关键修复：用实际的 s / e 计算角度（对 60 取模），而不是整数 m / m+1
  function drawArcSegment(offsetStart, offsetEnd, color){
    if (offsetStart >= offsetEnd) return;
    const startM = Math.max(0, offsetStart);
    const endM = offsetEnd;
    for (let m = Math.floor(startM); m < Math.ceil(endM); m++){
      const s = Math.max(m, startM);
      const e = Math.min(m + 1, endM);
      if (s >= e) continue;
      const sInRing = s % CIRCLE_MINUTES;
      let eInRing = e % CIRCLE_MINUTES;
      // 处理 60 整点端点：eInRing 为 0 时说明这一格到圈尾，应画到 2π
      if (eInRing === 0 && e > s) eInRing = CIRCLE_MINUTES;
      const a1 = (sInRing / CIRCLE_MINUTES) * 2 * Math.PI - Math.PI/2;
      const a2 = (eInRing / CIRCLE_MINUTES) * 2 * Math.PI - Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, SEGMENT_RADIUS, a1, a2);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }
  }

  function drawArcSegmentInRing(offsetStart, offsetEnd, color, ring){
    const ringStart = ring * CIRCLE_MINUTES;
    const ringEnd = (ring + 1) * CIRCLE_MINUTES;
    const s = Math.max(offsetStart, ringStart);
    const e = Math.min(offsetEnd, ringEnd);
    if (s >= e) return;
    drawArcSegment(s, e, color);
  }

  function drawClock(){
    const clockBorder = getCSSVar('--clock-border') || '#b8c8d8';
    const tickMajor = getCSSVar('--clock-tick-major') || '#8a9bb0';
    const tickMinor = getCSSVar('--clock-tick-minor') || '#c0ccd8';
    const numColor = getCSSVar('--clock-num') || '#7a8ea0';
    const centerColor = getCSSVar('--clock-center') || '#b8cce0';

    ctx.clearRect(0,0,size,size);
    ctx.beginPath(); ctx.arc(cx,cy,R,0,2*Math.PI);
    ctx.strokeStyle = clockBorder; ctx.lineWidth = 2; ctx.stroke();

    for (let i=0; i<60; i++){
      const a = (i/60)*2*Math.PI - Math.PI/2;
      const isMajor = i % 5 === 0;
      const r1 = R - (isMajor ? 12 : 7);
      const r2 = R - 1;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1);
      ctx.lineTo(cx+Math.cos(a)*r2, cy+Math.sin(a)*r2);
      ctx.strokeStyle = isMajor ? tickMajor : tickMinor;
      ctx.lineWidth = isMajor ? 3 : 1.5;
      ctx.stroke();
    }

    for (let i=0; i<12; i++){
      const a = (i/12)*2*Math.PI - Math.PI/2;
      const nR = R - 36;
      const nX = cx + Math.cos(a) * nR;
      const nY = cy + Math.sin(a) * nR;
      ctx.font = 'bold 26px -apple-system, system-ui';
      ctx.fillStyle = numColor; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const num = i === 0 ? 12 : i;
      ctx.fillText(num.toString(), nX, nY);
    }

    const totalExam = Math.max(1, examEnd - examStart);
    const elapsed = getElapsedMinutes();

    const labelInfos = [];

    if (subSegments.length && totalExam > 0){
      let acc = 0;
      const segRanges = [];
      for (let idx=0; idx<subSegments.length; idx++){
        const seg = subSegments[idx];
        if (seg.duration <= 0) { segRanges.push(null); continue; }
        const s = acc;
        const e = Math.min(acc + seg.duration, totalExam);
        acc += seg.duration;
        if (s >= totalExam) { segRanges.push(null); continue; }
        segRanges.push({ s, e, seg, idx });
      }

      const maxRing = Math.ceil(totalExam / CIRCLE_MINUTES);

      // 从最外层向内画，最后画第 0 圈（顶层）
      for (let ring = maxRing - 1; ring >= 0; ring--){
        const ringStart = ring * CIRCLE_MINUTES;
        const ringEnd   = (ring + 1) * CIRCLE_MINUTES;
        // 本圈需要"被吃掉"的起点 = max(elapsed, 本圈起点)
        const clamp = Math.max(elapsed, ringStart);

        for (const range of segRanges){
          if (!range) continue;
          const { s, e, seg } = range;
          const drawStart = Math.max(s, clamp);
          const drawEnd   = Math.min(e, ringEnd);
          if (drawStart >= drawEnd) continue;
          // ring > 0 的层稍微调暗，方便区分层次
          const c = ring > 0 ? lightenColor(seg.color, -0.08) : seg.color;
          drawArcSegment(drawStart, drawEnd, c);

          // 标签只在第 0 圈显示
          if (showLabels && ring === 0) {
            const mid = (drawStart + drawEnd) / 2;
            const textRadius = SEGMENT_RADIUS * 0.62;
            const angle = ((mid % CIRCLE_MINUTES) / CIRCLE_MINUTES) * 2 * Math.PI - Math.PI/2;
            labelInfos.push({
              text: (seg.name || '?').charAt(0),
              angle: angle,
              radius: textRadius,
              color: lightenColor(seg.color, 0.4)
            });
          }
        }
      }

      // 高亮选中子段的边界
      if (activeSubIndex >= 0 && activeSubIndex < subSegments.length){
        let acc2 = 0;
        for (let i=0; i<activeSubIndex; i++) acc2 += subSegments[i].duration;
        const startOff = acc2;
        const endOff = Math.min(acc2 + subSegments[activeSubIndex].duration, totalExam);
        if (endOff > elapsed) drawRadiusHandle(endOff);
        if (startOff > elapsed) drawRadiusHandle(startOff);
      }
    }

    if (showLabels && labelInfos.length > 0) {
      labelInfos.forEach(info => {
        const x = cx + Math.cos(info.angle) * info.radius;
        const y = cy + Math.sin(info.angle) * info.radius;
        ctx.font = 'bold 64px -apple-system, system-ui';
        ctx.fillStyle = info.color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(info.text, x, y);
      });
    }

    // 时间流逝边界线
    if (elapsed > 0 && elapsed < totalExam) {
      const mInRing = elapsed % CIRCLE_MINUTES;
      const a = (mInRing / CIRCLE_MINUTES) * 2 * Math.PI - Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * SEGMENT_RADIUS, cy + Math.sin(a) * SEGMENT_RADIUS);
      ctx.strokeStyle = tickMajor;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.beginPath(); ctx.arc(cx,cy,8,0,2*Math.PI);
    ctx.fillStyle = centerColor; ctx.fill();

    let displayMinutes = examStart;
    if (virtualMinutes !== null) displayMinutes = virtualMinutes;
    else if (isEnded) displayMinutes = examEnd;
    const nowMinuteInHour = displayMinutes % 60;
    const ma = (nowMinuteInHour / 60) * 2 * Math.PI - Math.PI/2;
    const hourVal = Math.floor(displayMinutes/60) % 12 + (displayMinutes % 60)/60;
    const ha = (hourVal / 12) * 2 * Math.PI - Math.PI/2;

    const totalSeconds = Math.floor(displayMinutes * 60);
    let secondInt = totalSeconds % 60;
    if (secondInt < 0) secondInt += 60;
    const sa = (secondInt / 60) * 2 * Math.PI - Math.PI/2;

    const handHour = isDark ? '#7a8a9a' : '#6a7a8a';
    const handMinute = isDark ? '#a0b0c0' : '#8a9aaa';
    const handSecond = '#e88a9a';

    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ha)*SEGMENT_RADIUS*0.6, cy+Math.sin(ha)*SEGMENT_RADIUS*0.6);
    ctx.strokeStyle = handHour; ctx.lineWidth=7; ctx.lineCap='round'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ma)*SEGMENT_RADIUS*0.85, cy+Math.sin(ma)*SEGMENT_RADIUS*0.85);
    ctx.strokeStyle = handMinute; ctx.lineWidth=5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(sa)*SEGMENT_RADIUS*0.95, cy+Math.sin(sa)*SEGMENT_RADIUS*0.95);
    ctx.strokeStyle = handSecond; ctx.lineWidth=2; ctx.stroke();

    if (totalExam > 0){
      ctx.beginPath(); ctx.arc(cx+Math.cos(-Math.PI/2)*SEGMENT_RADIUS*0.94, cy+Math.sin(-Math.PI/2)*SEGMENT_RADIUS*0.94, 7, 0, 2*Math.PI);
      ctx.fillStyle='#7ad0a0'; ctx.fill();
      const endOff = totalExam % CIRCLE_MINUTES === 0 && totalExam > 0 ? 0 : totalExam % CIRCLE_MINUTES;
      const endAng = (endOff / CIRCLE_MINUTES) * 2 * Math.PI - Math.PI/2;
      ctx.beginPath(); ctx.arc(cx+Math.cos(endAng)*SEGMENT_RADIUS*0.94, cy+Math.sin(endAng)*SEGMENT_RADIUS*0.94, 7, 0, 2*Math.PI);
      ctx.fillStyle='#e88a9a'; ctx.fill();
    }
  }

  function drawRadiusHandle(offsetMin){
    const mInRing = offsetMin % CIRCLE_MINUTES;
    const a = (mInRing / CIRCLE_MINUTES) * 2 * Math.PI - Math.PI/2;
    const x1 = cx + Math.cos(a) * (SEGMENT_RADIUS*0.15);
    const y1 = cy + Math.sin(a) * (SEGMENT_RADIUS*0.15);
    const x2 = cx + Math.cos(a) * (SEGMENT_RADIUS*0.96);
    const y2 = cy + Math.sin(a) * (SEGMENT_RADIUS*0.96);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.strokeStyle='rgba(120,160,210,0.7)'; ctx.lineWidth=6; ctx.lineCap='round'; ctx.stroke();
    ctx.beginPath(); ctx.arc(x2,y2,7,0,2*Math.PI); ctx.fillStyle='#c0d8f0'; ctx.fill();
  }

  function updateSubList(){
    clampSubSegments();
    subListDiv.innerHTML = '';
    let acc = 0;
    const total = examEnd - examStart;
    subSegments.forEach((seg, i) => {
      const el = document.createElement('div');
      el.className = 'sub-item' + (i === activeSubIndex ? ' selected' : '');
      el.style.borderLeftColor = seg.color;
      el.onclick = (e) => {
        if (e.target.classList.contains('remove')) return;
        if (editingIndex === i) {
          activeSubIndex = (activeSubIndex === i) ? -1 : i;
        } else {
          enterEditMode(i);
        }
        updateSubList(); drawClock();
      };
      const nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = seg.name || '子段';
      const durSpan = document.createElement('span');
      durSpan.className = 'duration';
      durSpan.textContent = seg.duration + 'min';
      const timeSpan = document.createElement('span');
      timeSpan.className = 'time-range';
      acc += seg.duration;
      if (acc <= total){
        const s = (examStart + acc - seg.duration) % 1440;
        const e = (examStart + acc) % 1440;
        timeSpan.textContent = to24Str(s) + ' → ' + to24Str(e);
      } else timeSpan.textContent = '超出区间';
      const rm = document.createElement('button');
      rm.className = 'remove'; rm.textContent = '✕';
      rm.onclick = (e) => {
        e.stopPropagation();
        subSegments.splice(i,1);
        if (activeSubIndex >= i) activeSubIndex = Math.max(-1, activeSubIndex-1);
        if (editingIndex === i) exitEditMode();
        else if (editingIndex > i) editingIndex--;
        updateSubList(); drawClock();
      };
      el.append(nameSpan, durSpan, timeSpan, rm);
      subListDiv.appendChild(el);
    });
    drawClock();
  }

  function enterEditMode(index){
    editingIndex = index;
    const seg = subSegments[index];
    subNameInput.value = seg.name;
    subDurationInput.value = seg.duration;
    subColorInput.value = seg.color;
    addSubBtn.textContent = '✓';
    cancelEditBtn.style.display = 'inline';
    subFormTitle.textContent = '修改子时间段';
  }

  function exitEditMode(){
    editingIndex = -1;
    addSubBtn.textContent = '+';
    cancelEditBtn.style.display = 'none';
    subFormTitle.textContent = '子时间段';
    subNameInput.value = '资料';
    subDurationInput.value = 25;
    subColorInput.value = '#a8d8ea';
  }

  function addOrUpdateSub(){
    const name = subNameInput.value.trim() || '子段';
    let dur = parseInt(subDurationInput.value, 10);
    if (isNaN(dur) || dur <= 0){ alert('请输入有效时长'); return; }
    const color = subColorInput.value;

    const totalExam = Math.max(0, examEnd - examStart);
    if (editingIndex >= 0 && editingIndex < subSegments.length){
      subSegments[editingIndex] = { name, duration: dur, color };
      exitEditMode();
    } else {
      const used = subSegments.reduce((a, s) => a + s.duration, 0);
      const remaining = totalExam - used;
      if (remaining <= 0) { alert('考试区间已满，无法添加更多子段'); return; }
      if (dur > remaining) dur = remaining;
      subSegments.push({ name, duration: dur, color });
    }
    updateSubList();
  }

  function startClock(){
    if (isRunning && !isPaused) return;
    if (isEnded) isEnded = false;
    if (isPaused){
      isPaused = false;
      lastTickTime = performance.now();
    } else {
      isRunning = true;
      isPaused = false;
      accumulatedMs = 0;
      virtualMinutes = examStart;
      lastTickTime = performance.now();
    }
    if (clockInterval) clearInterval(clockInterval);
    clockInterval = setInterval(() => {
      if (isRunning && !isPaused && virtualMinutes !== null){
        const now = performance.now();
        const delta = now - lastTickTime;
        lastTickTime = now;
        accumulatedMs += delta;
        virtualMinutes = examStart + accumulatedMs / 60000;
        if (virtualMinutes >= examEnd){
          virtualMinutes = examEnd;
          stopClock();
          isEnded = true;
          drawClock();
          return;
        }
        drawClock();
      }
    }, 100);
    drawClock();
  }

  function pauseClock(){
    if (isRunning && !isPaused){
      isPaused = true;
      drawClock();
    }
  }

  function stopClock(){
    if (clockInterval){ clearInterval(clockInterval); clockInterval = null; }
    isRunning = false;
    isPaused = false;
    if (!isEnded) {
      virtualMinutes = null;
      accumulatedMs = 0;
    }
    drawClock();
  }

  function resetClock(){
    if (clockInterval){ clearInterval(clockInterval); clockInterval = null; }
    isRunning = false;
    isPaused = false;
    isEnded = false;
    virtualMinutes = null;
    accumulatedMs = 0;
    drawClock();
  }

  startInput.onchange = () => { const v=from24Str(startInput.value); if(!isNaN(v)){ examStart=v; if(examStart>=examEnd) examEnd=examStart+60; updateInputs(); updateSubList(); resetClock(); drawClock(); } };
  endInput.onchange = () => { const v=from24Str(endInput.value); if(!isNaN(v)){ examEnd=v; if(examEnd<=examStart) examStart=Math.max(0,examEnd-60); updateInputs(); updateSubList(); resetClock(); drawClock(); } };
  addSubBtn.onclick = addOrUpdateSub;
  cancelEditBtn.onclick = () => { exitEditMode(); updateSubList(); };
  startBtn.onclick = startClock;
  pauseBtn.onclick = pauseClock;
  stopBtn.onclick = () => { resetClock(); };

  updateInputs();
  updateSubList();
  requestAnimationFrame(() => {
    updateClockSize();
    drawClock();
  });
})();
</script>
</body>
</html>
